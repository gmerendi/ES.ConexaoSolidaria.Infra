networks:
  csnetwork: {}

volumes:
  campanhas_data: {}
  usuarios_data: {}
  rabbitmq_data: {}
  rabbitmq_logs: {}
  elasticsearch_data: {}
  redis_data: {}
  prometheus_data: {}
  grafana_data: {}


# ─────────────────────────────────────────────────────────────────────────────
# Docker configs: injeta o conteúdo do arquivo diretamente no container
# sem bind-mount de arquivo individual, evitando o erro do Docker Desktop
# no Windows/WSL: "mount src=... not a directory"
# ─────────────────────────────────────────────────────────────────────────────
configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      scrape_configs:
        - job_name: "usuarios-api"
          static_configs:
            - targets: ["cs-usuarios-api:8080"]
          metrics_path: /metrics
          scrape_interval: 10s

        - job_name: "campanhas-api"
          static_configs:
            - targets: ["cs-campanhas-api:8080"]
          metrics_path: /metrics
          scrape_interval: 10s

        - job_name: "donationworker"
          static_configs:
            - targets: ["cs-donationworker-api:8080"]
          metrics_path: /metrics
          scrape_interval: 10s

        - job_name: "prometheus"
          static_configs:
            - targets: ["localhost:9090"]
  
  grafana_datasource:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://cs-prometheus:9090
          isDefault: true
          editable: false





services:
  ###########################################################################
  # RABBITMQ
  ###########################################################################
  cs.rabbitmq:
    image: rabbitmq:4.1.6-management-alpine
    container_name: cs-rabbitmq
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: fiap
      RABBITMQ_DEFAULT_PASS: fiap123
      RABBITMQ_DEFAULT_VHOST: /
    networks: 
      - csnetwork
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 30s
      retries: 3
      start_period: 60s


  ###########################################################################
  # DYNAMODB
  ###########################################################################
  cs.dynamo.db:
    image: amazon/dynamodb-local
    container_name: cs-dynamo-db
    ports:
      - "8000:8000"
    networks:
      - csnetwork
    command: "-jar DynamoDBLocal.jar -sharedDb"


  ###########################################################################
  # REDIS
  ###########################################################################
  cs.redis:
    image: redis:alpine
    container_name: cs-redis
    networks:
      - csnetwork
    ports:
      - "6379:6379"

  ###########################################################################
  # ELASTICSEARCH
  ###########################################################################
  cs.elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: cs-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - csnetwork


  ###########################################################################
  # USUARIOS-DB
  ###########################################################################
  cs.usuarios.db:
    image: postgres:15-alpine
    container_name: cs-usuarios-db
    environment:
      POSTGRES_USER: fiap
      POSTGRES_PASSWORD: fiap123
      POSTGRES_DB: cs-usuarios
    networks: 
      - csnetwork
    ports:
      - "5432:5432"
    volumes:

      - usuarios_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fiap", "-d", "cs-usuarios"]
      interval: 5s
      timeout: 5s
      retries: 5


  ###########################################################################
  # CAMPANHAS-DB
  ###########################################################################
  cs.campanhas.db:
    image: postgres:15-alpine
    container_name: cs-campanhas-db
    environment:
      POSTGRES_USER: fiap
      POSTGRES_PASSWORD: fiap123
      POSTGRES_DB: cs-campanhas
    networks: 
      - csnetwork
    ports:
      - "5433:5432"
    volumes:

      - campanhas_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "fiap", "-d", "cs-campanhas"]
      interval: 5s
      timeout: 5s
      retries: 5


  ###########################################################################
  # USUARIOS-API
  ###########################################################################
  cs.usuarios.api:
    image: ${DOCKER_REGISTRY-}cs-usuarios-api:latest
    build:
      context: ../../ES.ConexaoSolidaria.Usuarios
      dockerfile: src/Usuarios.Api/Dockerfile
    container_name: cs-usuarios-api
    ports:
      - 5001:8080
    depends_on:
      cs.usuarios.db:
        condition: service_healthy
      cs.redis:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      #ConnectionStrings
      ConnectionStrings__Database: "Host=cs-usuarios-db;Port=5432;Database=cs-usuarios;Username=fiap;Password=fiap123"
      ConnectionStrings__ConnectionString: "Host=cs-usuarios-db;Port=5432;Database=cs-usuarios;Username=fiap;Password=fiap123"
      ConnectionStrings__AuditLog: "http://cs-dynamo-db:8000"
      ConnectionStrings__Redis: "cs-redis:6379"

      #RabbitMq
      RabbitMq__Host: "cs-rabbitmq"
      RabbitMq__Username: "fiap"
      RabbitMq__Password: "fiap123"

      #Queues
      QUEUES__USER_CREATED_QUEUE: "user-created-queue"

      #JWT
      Jwt__SecretKey: "ChaveSuperSecretaComMaisDe32CaracteresAqui12345"
      Jwt__Issuer: "ES-ConexaoSolidariaIssuer"
      Jwt__Audience: "ES-ConexaoSolidariaClient"
      Jwt__ExpirationHours: "3"
      AES__KEY: "W36tuZgAwZTkvGebRMEQJjGtbLNJRK6unGj1Ow5Rnm8="

      #Logs
      CustomLogging__LogInfo: "True"
      CustomLogging__LogError: "True"
      CustomLogging__LogWarning: "True"
      CustomLogging__SendLogToDB: "True"

      #Configuration
      Application__Type: "LOCAL"
    networks: 
      - csnetwork
    restart: on-failure



  ###########################################################################
  # CAMPANHAS-API
  ###########################################################################
  cs.campanhas.api:
    image: ${DOCKER_REGISTRY-}cs-campanhas-api:latest
    build:
      context: ../../ES.ConexaoSolidaria.Campanhas
      dockerfile: src/Campanhas.Api/Dockerfile
    container_name: cs-campanhas-api
    ports:
      - 5002:8080
    depends_on:
      cs.campanhas.db:
        condition: service_healthy
      cs.redis:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      #ConnectionStrings
      ConnectionStrings__Database: "Host=cs-campanhas-db;Port=5432;Database=cs-campanhas;Username=fiap;Password=fiap123"
      ConnectionStrings__AuditLog: "http://cs-dynamo-db:8000"
      ConnectionStrings__Redis: "cs-redis:6379"
      ConnectionStrings__ElasticSearch: "http://cs-elasticsearch:9200"

      #RabbitMq
      RabbitMq__Host: "cs-rabbitmq"
      RabbitMq__Username: "fiap"
      RabbitMq__Password: "fiap123"

      #Queues
      QUEUES__USER_CREATED_QUEUE: "user-created-queue"

      #JWT
      Jwt__SecretKey: "ChaveSuperSecretaComMaisDe32CaracteresAqui12345"
      Jwt__Issuer: "ES-ConexaoSolidariaIssuer"
      Jwt__Audience: "ES-ConexaoSolidariaClient"
      Jwt__ExpirationHours: "3"
      AES__KEY: "W36tuZgAwZTkvGebRMEQJjGtbLNJRK6unGj1Ow5Rnm8="

      # Cache TTL
      Cache__CampanhaAtivaTTLSeconds: "60"
      Cache__CampanhaNaoAtivaTTLSeconds: "86400"

      #Logs
      CustomLogging__LogInfo: "True"
      CustomLogging__LogError: "True"
      CustomLogging__LogWarning: "True"
      CustomLogging__SendLogToDB: "True"

      #Configuration
      Application__Type: "LOCAL"
    networks: 
      - csnetwork
    restart: on-failure


  ###########################################################################
  # WORKER
  ###########################################################################
  cs.donationworker:
    image: ${DOCKER_REGISTRY-}cs-donationworker-api:latest
    build:
      context: ../../ES.ConexaoSolidaria.Worker
      dockerfile: src/DonationWorker/Dockerfile
    container_name: cs-donationworker-api
    ports:
      - 5003:8080
    # depends_on:
    #   cs.campanhas.api:
    #     condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      #ConnectionStrings
      ConnectionStrings__Database: "Host=cs-campanhas-db;Port=5432;Database=cs-campanhas;Username=fiap;Password=fiap123"
      ConnectionStrings__AuditLog: "http://cs-dynamo-db:8000"

      #RabbitMq
      RabbitMq__Host: "cs-rabbitmq"
      RabbitMq__Username: "fiap"
      RabbitMq__Password: "fiap123"

      #Queues
      QUEUES__DONATION_CREATED_QUEUE: "donation-created-queue"

      #JWT
      Jwt__SecretKey: "ChaveSuperSecretaComMaisDe32CaracteresAqui12345"
      Jwt__Issuer: "ES-ConexaoSolidariaIssuer"
      Jwt__Audience: "ES-ConexaoSolidariaClient"
      Jwt__ExpirationHours: "3"
      AES__KEY: "W36tuZgAwZTkvGebRMEQJjGtbLNJRK6unGj1Ow5Rnm8="

      # Cache TTL
      Cache__CampanhaAtivaTTLSeconds: "60"
      Cache__CampanhaNaoAtivaTTLSeconds: "86400"

      #Logs
      CustomLogging__LogInfo: "True"
      CustomLogging__LogError: "True"
      CustomLogging__LogWarning: "True"
      CustomLogging__SendLogToDB: "True"

      #Configuration
      Application__Type: "LOCAL"
    networks: 
      - csnetwork
    restart: on-failure



  ###########################################################################
  # NOTIFICACOES
  ###########################################################################
  cs.notificacoes:
    image: ${DOCKER_REGISTRY-}cs-notificacoes-api:latest
    build:
      context: ../../ES.ConexaoSolidaria.Notificacoes
      dockerfile: src/Notificacoes/Dockerfile
    container_name: cs-notificacoes
    ports:
      - 5004:8080
    depends_on:
      cs.rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      #ConnectionStrings
      ConnectionStrings__Database: "Host=cs-campanhas-db;Port=5432;Database=cs-campanhas;Username=fiap;Password=fiap123"
      ConnectionStrings__AuditLog: "http://cs-dynamo-db:8000"
      ConnectionStrings__Redis: "cs-redis:6379"
      ConnectionStrings__ElasticSearch: "http://cs-elasticsearch:9200"

      #RabbitMq
      RabbitMq__Host: "cs-rabbitmq"
      RabbitMq__Username: "fiap"
      RabbitMq__Password: "fiap123"

      #Queues
      QUEUES__USER_CREATED_QUEUE: "user-created-queue"
      QUEUES__DONATION_CREATED_QUEUE: "donation-created-queue"
      QUEUES__DONATION_PROCESSED_QUEUE: "donation_processed-queue"

      #JWT
      Jwt__SecretKey: "ChaveSuperSecretaComMaisDe32CaracteresAqui12345"
      Jwt__Issuer: "ES-ConexaoSolidariaIssuer"
      Jwt__Audience: "ES-ConexaoSolidariaClient"
      Jwt__ExpirationHours: "3"
      AES__KEY: "W36tuZgAwZTkvGebRMEQJjGtbLNJRK6unGj1Ow5Rnm8="

      # Cache TTL
      Cache__CampanhaAtivaTTLSeconds: "60"
      Cache__CampanhaNaoAtivaTTLSeconds: "86400"

      #Email
      Email__SmtpHost: "cs-mailpit"
      Email__SmtpPort: "1025"
      Email__NomeRemetente: "Conexao Solidaria"
      Email__EmailRemetente: "noreply@conexao-solidaria.com.br"

      #Logs
      CustomLogging__LogInfo: "True"
      CustomLogging__LogError: "True"
      CustomLogging__LogWarning: "True"
      CustomLogging__SendLogToDB: "True"

      #Configuration
      Application__Type: "LOCAL"
      Admin__Email: "admin@conexao-solidaria.com.br"
      Admin__Password: "12345678Aa#"
    networks: 
      - csnetwork
    restart: on-failure


  ###########################################################################
  # GATEWAY
  ###########################################################################
  cs.gateway.api:
    image: ${DOCKER_REGISTRY-}cs-gateway-api:latest
    build:
      context:  ../../ES.ConexaoSolidaria.Gateway
      dockerfile: src/Gateway.Api/Dockerfile
    container_name: cs-gateway-api
    ports:
      - 5006:8080
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080

      #JWT
      Jwt__SecretKey: "ChaveSuperSecretaComMaisDe32CaracteresAqui12345"
      Jwt__Issuer: "ES-ConexaoSolidariaIssuer"
      Jwt__Audience: "ES-ConexaoSolidariaClient"
      Jwt__ExpirationHours: "3"
      AES__KEY: "W36tuZgAwZTkvGebRMEQJjGtbLNJRK6unGj1Ow5Rnm8="

      #Logs
      CustomLogging__LogInfo: "True"
      CustomLogging__LogError: "True"
      CustomLogging__LogWarning: "True"
      CustomLogging__SendLogToDB: "True"

      #RateLimiting
      RateLimiting__PermitLimit: "100"
      RateLimiting__WindowSeconds: "60"

      #Gateway
      Gateway__BaseUrl: "http://localhost:5006"

      #Configuration
      Application__Type: "LOCAL"

      #FrontEnd
      FRONTEND_URL: "http://localhost:5000"

      #Swagger
      Swagger__Endpoints__0__Id: "usuarios"
      Swagger__Endpoints__0__Url: "http://cs-usuarios-api:8080/swagger/v1/swagger.json"
      Swagger__Endpoints__0__Name: "Usuarios API"

      Swagger__Endpoints__1__Id: "campanhas"
      Swagger__Endpoints__1__Url: "http://cs-campanhas-api:8080/swagger/v1/swagger.json"
      Swagger__Endpoints__1__Name: "Campanhas API"

      #ReverseProxy - Routes
      ReverseProxy__Routes__auth-publico__ClusterId: "usuarios-cluster"
      ReverseProxy__Routes__auth-publico__AuthorizationPolicy: "public"
      ReverseProxy__Routes__auth-publico__Match__Path: "/api/v1/auth/{**catch-all}"

      ReverseProxy__Routes__usuarios-cadastro__ClusterId: "usuarios-cluster"
      ReverseProxy__Routes__usuarios-cadastro__AuthorizationPolicy: "public"
      ReverseProxy__Routes__usuarios-cadastro__Match__Path: "/api/v1/usuario"
      ReverseProxy__Routes__usuarios-cadastro__Match__Methods__0: "POST"

      ReverseProxy__Routes__usuarios-autenticado__ClusterId: "usuarios-cluster"
      ReverseProxy__Routes__usuarios-autenticado__AuthorizationPolicy: "authenticated"
      ReverseProxy__Routes__usuarios-autenticado__Match__Path: "/api/v1/usuario/{**catch-all}"

      ReverseProxy__Routes__campanhas-todas__ClusterId: "campanhas-cluster"
      ReverseProxy__Routes__campanhas-todas__AuthorizationPolicy: "public"
      ReverseProxy__Routes__campanhas-todas__Match__Path: "/api/v1/Campanhas/todas"

      ReverseProxy__Routes__campanhas-autenticado__ClusterId: "campanhas-cluster"
      ReverseProxy__Routes__campanhas-autenticado__AuthorizationPolicy: "authenticated"
      ReverseProxy__Routes__campanhas-autenticado__Match__Path: "/api/v1/Campanhas/{**catch-all}"

      ReverseProxy__Routes__doacoes-autenticado__ClusterId: "campanhas-cluster"
      ReverseProxy__Routes__doacoes-autenticado__AuthorizationPolicy: "authenticated"
      ReverseProxy__Routes__doacoes-autenticado__Match__Path: "/api/v1/Doacoes/{**catch-all}"

      ReverseProxy__Routes__health-usuarios__ClusterId: "usuarios-cluster"
      ReverseProxy__Routes__health-usuarios__AuthorizationPolicy: "public"
      ReverseProxy__Routes__health-usuarios__Match__Path: "/health/usuarios"
      ReverseProxy__Routes__health-usuarios__Transforms__0__PathSet: "/health"

      ReverseProxy__Routes__health-campanhas__ClusterId: "campanhas-cluster"
      ReverseProxy__Routes__health-campanhas__AuthorizationPolicy: "public"
      ReverseProxy__Routes__health-campanhas__Match__Path: "/health/campanhas"
      ReverseProxy__Routes__health-campanhas__Transforms__0__PathSet: "/health"

      #ReverseProxy - Clusters
      ReverseProxy__Clusters__usuarios-cluster__Destinations__usuarios-api__Address: "http://cs-usuarios-api:8080"
      ReverseProxy__Clusters__campanhas-cluster__Destinations__campanhas-api__Address: "http://cs-campanhas-api:8080"
 
    networks: 
      - csnetwork
    restart: on-failure

  ###########################################################################
  # MAILPIT
  ###########################################################################
  cs.mailpit:
    image: axllent/mailpit:latest
    container_name: cs-mailpit
    ports:
      - "1025:1025"  # SMTP — o worker envia para essa porta
      - "8025:8025"  # Interface web 
    networks: 
      - csnetwork




  ###########################################################################
  # PROMETHEUS
  ###########################################################################
  cs.prometheus:
    image: prom/prometheus:v2.53.0
    container_name: cs-prometheus
    ports:
      - "9090:9090"
    # Usa Docker config em vez de bind-mount de arquivo (compatível com Windows/WSL)
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
    volumes:
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    networks:
      - csnetwork
    depends_on:
      - cs.usuarios.api
      - cs.campanhas.api
      - cs.donationworker
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3



  ###########################################################################
  # GRAFANA
  ###########################################################################
  cs.grafana:
    image: grafana/grafana:11.1.0
    container_name: cs-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: fiap123
      GF_USERS_ALLOW_SIGN_UP: "false"
    configs:
      - source: grafana_datasource
        target: /etc/grafana/provisioning/datasources/prometheus.yaml
    volumes:
      # Apenas o dashboard (pasta inteira — sem problema no Windows)
      - ./observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - csnetwork
    depends_on:
      - cs.prometheus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
