apiVersion: v1
kind: ConfigMap
metadata:
  name: cs-zabbix-init-script
  labels:
    project: conexao-solidaria
data:
  init.py: |
    import urllib.request, urllib.error, json, time

    url = 'http://cs-zabbix/api_jsonrpc.php'
    headers = {'Content-Type': 'application/json'}

    def zbx_call(payload):
        req = urllib.request.Request(url, json.dumps(payload).encode(), headers)
        with urllib.request.urlopen(req) as r:
            return json.loads(r.read())

    print('Aguardando API...')
    while True:
        try:
            zbx_call({'jsonrpc':'2.0','method':'apiinfo.version','params':[],'id':1})
            break
        except:
            print('API nao disponivel, aguardando...')
            time.sleep(5)

    time.sleep(10)
    print('API disponivel!')

    resp = zbx_call({'jsonrpc':'2.0','method':'user.login','params':{'user':'Admin','password':'zabbix'},'id':1})
    token = resp['result']
    print('Token:', token)

    resp = zbx_call({'jsonrpc':'2.0','method':'host.update','params':{'hostid':'10084','interfaces':[{'interfaceid':'1','dns':'cs-zabbix-agent','ip':'','useip':0,'port':'10050'}]},'auth':token,'id':2})
    print('Host atualizado:', resp)

    resp = zbx_call({'jsonrpc':'2.0','method':'dashboard.update','params':{'dashboardid':'2','name':'Zabbix server health','userid':'1','private':'1','widgets':[{'type':'problems','name':'Zabbix server problems','x':0,'y':0,'width':20,'height':4,'view_mode':0,'fields':[{'type':3,'name':'hostids','value':'10084'}]},{'type':'clock','name':'Local time','x':20,'y':0,'width':4,'height':4,'view_mode':1,'fields':[]},{'type':'graph','name':'Utilizacao de CPU','x':0,'y':4,'width':8,'height':5,'view_mode':0,'fields':[{'type':6,'name':'graphid','value':'907'}]},{'type':'graph','name':'Utilizacao de Memoria','x':8,'y':4,'width':8,'height':5,'view_mode':0,'fields':[{'type':6,'name':'graphid','value':'916'}]},{'type':'graph','name':'Performance do Zabbix Server','x':16,'y':4,'width':8,'height':5,'view_mode':0,'fields':[{'type':6,'name':'graphid','value':'519'}]},{'type':'graph','name':'Trafego de Rede','x':0,'y':9,'width':12,'height':5,'view_mode':0,'fields':[{'type':6,'name':'graphid','value':'1136'}]},{'type':'graph','name':'Uso de Disco','x':12,'y':9,'width':4,'height':5,'view_mode':0,'fields':[{'type':6,'name':'graphid','value':'1139'}]},{'type':'graph','name':'','x':16,'y':9,'width':8,'height':5,'view_mode':0,'fields':[{'type':6,'name':'graphid','value':'520'}]}]},'auth':token,'id':3})
    print('Dashboard atualizado:', resp)
    print('Init concluido!')