apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs-campanhas-api
  labels:
    app: cs-campanhas-api
    project: conexao-solidaria
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # sobe 1 pod novo antes de derrubar o antigo
      maxUnavailable: 0  # garante zero downtime
  selector:
    matchLabels:
      app: cs-campanhas-api
  template:
    metadata:
      labels:
        app: cs-campanhas-api
        project: conexao-solidaria
    spec:
      containers:
        - name: cs-campanhas-api
          image: 357177055772.dkr.ecr.us-east-1.amazonaws.com/cs-campanhas-api:${IMAGE_TAG}
          # imagePullPolicy: Never → usa a imagem local buildada pelo docker-compose
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080      

          # ── Variáveis ──────────────────────────────────
          env:
           #AspnetCore
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: ASPNETCORE_ENVIRONMENT

            - name: ASPNETCORE_URLS
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: ASPNETCORE_URLS

            # Application Type - LOCAL ou LAB
            - name: Application__Type
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: APPLICATION_TYPE
            #JWT
            - name: Jwt__SecretKey
              valueFrom:
                secretKeyRef:
                  name: cs-campanhas-secrets
                  key: JWT_SECRETKEY

            - name: Jwt__Issuer
              valueFrom:
                secretKeyRef:
                  name: cs-campanhas-secrets
                  key: JWT_ISSUER

            - name: Jwt__Audience
              valueFrom:
                secretKeyRef:
                  name: cs-campanhas-secrets
                  key: JWT_AUDIENCE

            - name: Jwt__ExpirationHours
              valueFrom:
                secretKeyRef:
                  name: cs-campanhas-secrets
                  key: JWT_EXPIRATION_HOURS

            - name: AES__KEY
              valueFrom:
                secretKeyRef:
                  name: cs-campanhas-secrets
                  key: AES_KEY

            #Rabbitmq
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: cs-campanhas-secrets
                  key: RABBITMQ_PASSWORD

            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef:
                  name: cs-campanhas-secrets
                  key: RABBITMQ_USERNAME

            - name: RabbitMq__Host
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: RABBITMQ_SVC

            - name: DONATION_CREATED_QUEUE
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: RABBITMQ_DONATION_CREATED_QUEUE

            #Cache
            - name: Cache__CampanhaAtivaTTLSeconds
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: CACHE_CAMPANHA_ATIVA_TTL_SECONDS

            - name: Cache__CampanhaNaoAtivaTTLSeconds
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: CACHE_CAMPANHA_NAO_ATIVA_TTL_SECONDS

            #Database
            - name: CAMPANHAS_DB_SVC
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: CAMPANHAS_DB_SVC
            - name: CAMPANHAS_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: CAMPANHAS_POSTGRES_DB
            - name: CAMPANHAS_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: cs-campanhas-secrets
                  key: CAMPANHAS_POSTGRES_PASSWORD
            - name: CAMPANHAS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: cs-campanhas-secrets
                  key: CAMPANHAS_POSTGRES_USER
            - name: DYNAMODB_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: DYNAMODB_SERVICE_URL
            - name: REDIS_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: REDIS_SERVICE_URL
            - name: ELASTICSEARCH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: ELASTICSEARCH_SERVICE_URL


            #ConnectionStrings
            - name: ConnectionStrings__Database
              value: "Host=$(CAMPANHAS_DB_SVC);Database=$(CAMPANHAS_DB_NAME);Username=$(CAMPANHAS_DB_USER);Password=$(CAMPANHAS_DB_PASS)"

            - name: ConnectionStrings__AuditLog
              value: $(DYNAMODB_SERVICE_URL)

            - name: ConnectionStrings__Redis
              value: $(REDIS_SERVICE_URL)

            - name: ConnectionStrings__ElasticSearch
              value: $(ELASTICSEARCH_SERVICE_URL)


            #Logs
            - name: CustomLogging__LogInfo
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: CUSTOMLOGGING_LOGINFO
            - name: CustomLogging__LogError
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: CUSTOMLOGGING_LOGERROR
            - name: CustomLogging__LogWarning
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: CUSTOMLOGGING_LOGWARNING
            # Envia todos os logs para o DynamoDB. Eventos são sempre enviados
            - name: CustomLogging__SendLogToDB
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: CUSTOMLOGGING_SENDLOGTODB

            #AWS
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: AWS_REGION
          
          envFrom:
            - secretRef:
                name: cs-aws-credentials
          

          # ── Recursos ────────────────────────────────────────────────────
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"

          # ── Liveness Probe ───────────────────────────────────────────────
          # Se falhar: Kubernetes reinicia o container
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # ── Readiness Probe ──────────────────────────────────────────────
          # Se falhar: pod sai do Service até estar pronto
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1