# *********************************************************************************************************************** #
apiVersion: v1
kind: PersistentVolume
metadata:
  name: cs-rabbitmq-pv
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: "" # Nome customizado para ignorar a AWS
  hostPath:
    path: "/mnt/data"


---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cs-rabbitmq-pvc
spec:
  storageClassName: ""
  volumeName: cs-rabbitmq-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Mi