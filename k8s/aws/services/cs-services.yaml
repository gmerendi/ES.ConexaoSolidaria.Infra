# *********************************************************************************************************************** #
# ELASTICSEARCH                                                                                                           #       
# *********************************************************************************************************************** #
---
apiVersion: v1
kind: Service
metadata:
  name: cs-elasticsearch
  labels:
    app: cs-elasticsearch
    project: conexao-solidaria
spec:
  selector:
    app: cs-elasticsearch
  type: ClusterIP
  ports:
    - name: http
      port: 9200
      targetPort: 9200
      protocol: TCP
    - name: transport
      port: 9300
      targetPort: 9300
      protocol: TCP


# *********************************************************************************************************************** #
# USUARIOS API                                                                                                            #       
# *********************************************************************************************************************** #
---
apiVersion: v1
kind: Service
metadata:
  name: cs-usuarios-api-svc
  labels:
    app: cs-usuarios-api
    project: conexao-solidaria
  annotations:
    # Estas anotações forçam a AWS a criar um NLB ao invés de um CLB
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    # Isso garante que o LB não fique exposto na internet, apenas para o API Gateway
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
spec:
  selector:
    app: cs-usuarios-api
  type: LoadBalancer
  ports:
    - name: http
      port: 5001
      targetPort: 8080
      protocol: TCP


