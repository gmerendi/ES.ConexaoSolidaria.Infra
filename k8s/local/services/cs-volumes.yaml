# *********************************************************************************************************************** #
# RABBITMQ                                                                                                                #       
# *********************************************************************************************************************** #
apiVersion: v1
kind: PersistentVolume
metadata:
  name: cs-rabbitmq-pv
  labels:
    app: rabbitmq
    project: conexao-solidaria
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: "" # Nome customizado para ignorar a AWS
  hostPath:
    path: "/mnt/data"




# *********************************************************************************************************************** #
# ELASTICSEARCH                                                                                                           #       
# *********************************************************************************************************************** #
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cs-elasticsearch-pvc
  labels:
    app: cs-elasticsearch-pvc
    project: conexao-solidaria
spec:
  storageClassName: ""
  volumeName: cs-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Mi


# *********************************************************************************************************************** #
# ZABBIX                                                                                                                  #       
