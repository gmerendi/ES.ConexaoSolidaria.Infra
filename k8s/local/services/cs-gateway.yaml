apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs-gateway-api
  labels:
    app: cs-gateway-api
    project: conexao-solidaria
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # sobe 1 pod novo antes de derrubar o antigo
      maxUnavailable: 0  # garante zero downtime
  selector:
    matchLabels:
      app: cs-gateway-api
  template:
    metadata:
      labels:
        app: cs-gateway-api
        project: conexao-solidaria
    spec:
      containers:
        - name: cs-gateway-api
          image: cs-gateway-api:latest
          # imagePullPolicy: Never → usa a imagem local buildada pelo docker-compose
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080      

          # ── Injeção de ConfigMaps Inteiros ──────────────────────────────
          envFrom:
            - configMapRef:
                name: cs-configproxy   # <--- Puxa TODAS as rotas do Yarp e Swagger de uma vez só!

          # ── Variáveis ──────────────────────────────────
          env:
           #AspnetCore
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: ASPNETCORE_ENVIRONMENT

            - name: ASPNETCORE_URLS
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: ASPNETCORE_URLS


            # Application Type - LOCAL ou LAB
            - name: Application__Type
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: APPLICATION_TYPE

            #JWT
            - name: Jwt__SecretKey
              valueFrom:
                secretKeyRef:
                  name: cs-secrets
                  key: JWT_SECRETKEY

            - name: Jwt__Issuer
              valueFrom:
                secretKeyRef:
                  name: cs-secrets
                  key: JWT_ISSUER

            - name: Jwt__Audience
              valueFrom:
                secretKeyRef:
                  name: cs-secrets
                  key: JWT_AUDIENCE

            - name: Jwt__ExpirationHours
              valueFrom:
                secretKeyRef:
                  name: cs-secrets
                  key: JWT_EXPIRATION_HOURS

            - name: AES__KEY
              valueFrom:
                secretKeyRef:
                  name: cs-secrets
                  key: AES_KEY

          




          #Logs
            - name: CustomLogging__LogInfo
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: CUSTOMLOGGING_LOGINFO
            - name: CustomLogging__LogError
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: CUSTOMLOGGING_LOGERROR
            - name: CustomLogging__LogWarning
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: CUSTOMLOGGING_LOGWARNING
            # Envia todos os logs para o DynamoDB. Eventos são sempre enviados
            - name: CustomLogging__SendLogToDB
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: CUSTOMLOGGING_SENDLOGTODB
          

          # ── Recursos ────────────────────────────────────────────────────
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # ── Liveness Probe ───────────────────────────────────────────────
          # Se falhar: Kubernetes reinicia o container
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # ── Readiness Probe ──────────────────────────────────────────────
          # Se falhar: pod sai do Service até estar pronto
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1