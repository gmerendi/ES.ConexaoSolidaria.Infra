apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs-zabbix
  labels:
    app: cs-zabbix
    project: conexao-solidaria
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cs-zabbix
  template:
    metadata:
      labels:
        app: cs-zabbix
        project: conexao-solidaria
    spec:
      containers:
        - name: cs-zabbix
          image: zabbix/zabbix-appliance:alpine-latest
          ports:
            - containerPort: 80
            - containerPort: 10051
          volumeMounts:
            - name: zabbix-data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 180
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: zabbix-data
          persistentVolumeClaim:
            claimName: cs-zabbix-pvc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs-zabbix-agent
  labels:
    app: cs-zabbix-agent
    project: conexao-solidaria
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cs-zabbix-agent
  template:
    metadata:
      labels:
        app: cs-zabbix-agent
        project: conexao-solidaria
    spec:
      containers:
        - name: cs-zabbix-agent
          image: zabbix/zabbix-agent:alpine-latest
          env:
            - name: ZBX_HOSTNAME
              value: "Zabbix server"
            - name: ZBX_SERVER_HOST
              value: "cs-zabbix-svc"
            - name: ZBX_SERVER_PORT
              value: "10051"
            - name: ZBX_SERVER_ACTIVE
              value: "cs-zabbix-svc"
            - name: ZBX_PASSIVESERVERS
              value: "0.0.0.0/0"
          ports:
            - containerPort: 10050
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"


---
apiVersion: batch/v1
kind: Job
metadata:
  name: cs-zabbix-init
  labels:
    project: conexao-solidaria
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: cs-zabbix-init
          image: python:3.11-alpine
          command:
            - python3
            - -c
            - |
              import urllib.request, urllib.error, json, time

              url = 'http://cs-zabbix-svc/api_jsonrpc.php'
              headers = {'Content-Type': 'application/json'}

              def zbx_call(payload):
                  req = urllib.request.Request(url, json.dumps(payload).encode(), headers)
                  with urllib.request.urlopen(req) as r:
                      return json.loads(r.read())

              print('Aguardando API...')
              while True:
                  try:
                      zbx_call({'jsonrpc':'2.0','method':'apiinfo.version','params':[],'id':1})
                      break
                  except:
                      print('API nao disponivel, aguardando...')
                      time.sleep(5)

              time.sleep(10)
              print('API disponivel!')

              resp = zbx_call({'jsonrpc':'2.0','method':'user.login','params':{'user':'Admin','password':'zabbix'},'id':1})
              token = resp['result']
              print('Token:', token)

              resp = zbx_call({'jsonrpc':'2.0','method':'host.update','params':{'hostid':'10084','interfaces':[{'interfaceid':'1','dns':'cs-zabbix-agent-svc','ip':'','useip':0,'port':'10050'}]},'auth':token,'id':2})
              print('Host atualizado:', resp)

              resp = zbx_call({'jsonrpc':'2.0','method':'dashboard.update','params':{'dashboardid':'2','name':'Zabbix server health','userid':'1','private':'1','widgets':[{'type':'problems','name':'Zabbix server problems','x':0,'y':0,'width':20,'height':4,'view_mode':0,'fields':[{'type':3,'name':'hostids','value':'10084'}]},{'type':'clock','name':'Local time','x':20,'y':0,'width':4,'height':4,'view_mode':1,'fields':[]},{'type':'graph','name':'Utilizacao de CPU','x':0,'y':4,'width':8,'height':5,'view_mode':0,'fields':[{'type':6,'name':'graphid','value':'907'}]},{'type':'graph','name':'Utilizacao de Memoria','x':8,'y':4,'width':8,'height':5,'view_mode':0,'fields':[{'type':6,'name':'graphid','value':'916'}]},{'type':'graph','name':'Performance do Zabbix Server','x':16,'y':4,'width':8,'height':5,'view_mode':0,'fields':[{'type':6,'name':'graphid','value':'519'}]},{'type':'graph','name':'Trafego de Rede','x':0,'y':9,'width':12,'height':5,'view_mode':0,'fields':[{'type':6,'name':'graphid','value':'1136'}]},{'type':'graph','name':'Uso de Disco','x':12,'y':9,'width':4,'height':5,'view_mode':0,'fields':[{'type':6,'name':'graphid','value':'1139'}]},{'type':'graph','name':'','x':16,'y':9,'width':8,'height':5,'view_mode':0,'fields':[{'type':6,'name':'graphid','value':'520'}]}]},'auth':token,'id':3})
              print('Dashboard atualizado:', resp)
              print('Init concluido!')