apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs-donationworker
  labels:
    app: cs-donationworker
    project: conexao-solidaria
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # sobe 1 pod novo antes de derrubar o antigo
      maxUnavailable: 0  # garante zero downtime
  selector:
    matchLabels:
      app: cs-donationworker
  template:
    metadata:
      labels:
        app: cs-donationworker
        project: conexao-solidaria
    spec:
      containers:
        - name: cs-donationworker
          image: cs-campanhas-api:latest
          # imagePullPolicy: Never → usa a imagem local buildada pelo docker-compose
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080      

          # ── Variáveis ──────────────────────────────────
          env:
           #AspnetCore
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: ASPNETCORE_ENVIRONMENT

            - name: ASPNETCORE_URLS
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: ASPNETCORE_URLS

            # Application Type - LOCAL ou LAB
            - name: Application__Type
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: APPLICATION_TYPE
            #JWT
            - name: Jwt__SecretKey
              valueFrom:
                secretKeyRef:
                  name: cs-secrets
                  key: JWT_SECRETKEY

            - name: Jwt__Issuer
              valueFrom:
                secretKeyRef:
                  name: cs-secrets
                  key: JWT_ISSUER

            - name: Jwt__Audience
              valueFrom:
                secretKeyRef:
                  name: cs-secrets
                  key: JWT_AUDIENCE

            - name: Jwt__ExpirationHours
              valueFrom:
                secretKeyRef:
                  name: cs-secrets
                  key: JWT_EXPIRATION_HOURS

            #Rabbitmq
            - name: RabbitMq__Password
              valueFrom:
                secretKeyRef:
                  name: cs-secrets
                  key: RABBITMQ_PASSWORD

            - name: RabbitMq__Username
              valueFrom:
                secretKeyRef:
                  name: cs-secrets
                  key: RABBITMQ_USERNAME

            - name: RabbitMq__Host
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: RABBITMQ_SVC

            #Database
            - name: CAMPANHAS_DB_SVC
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: CAMPANHAS_DB_SVC
            - name: CAMPANHAS_DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: CAMPANHAS_POSTGRES_DB
            - name: CAMPANHAS_DB_PASS
              valueFrom:
                secretKeyRef:
                  name: cs-secrets
                  key: CAMPANHAS_POSTGRES_PASSWORD
            - name: CAMPANHAS_DB_USER
              valueFrom:
                secretKeyRef:
                  name: cs-secrets
                  key: CAMPANHAS_POSTGRES_USER
            - name: DYNAMODB_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: DYNAMODB_SERVICE_URL
            - name: REDIS_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: REDIS_SERVICE_URL
            - name: ELASTICSEARCH_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: ELASTICSEARCH_SERVICE_URL

            #ConnectionStrings
            - name: ConnectionStrings__Database
              value: "Host=$(CAMPANHAS_DB_SVC);Database=$(CAMPANHAS_DB_NAME);Username=$(CAMPANHAS_DB_USER);Password=$(CAMPANHAS_DB_PASS)"

            - name: ConnectionStrings__AuditLog
              value: $(DYNAMODB_SERVICE_URL)

            - name: ConnectionStrings__Redis
              value: $(REDIS_SERVICE_URL)

            - name: ConnectionStrings__ElasticSearch
              value: $(ELASTICSEARCH_SERVICE_URL)

            #AWS
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: AWS_ACCESS_KEY_ID

            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: AWS_SECRET_ACCESS_KEY

            - name: AWS_DEFAULT_REGION
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: AWS_DEFAULT_REGION

            - name: AWS_DYNAMODB_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: DYNAMODB_SERVICE_URL
          

          # ── Recursos ────────────────────────────────────────────────────
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # ── Liveness Probe ───────────────────────────────────────────────
          # Se falhar: Kubernetes reinicia o container
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # ── Readiness Probe ──────────────────────────────────────────────
          # Se falhar: pod sai do Service até estar pronto
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1