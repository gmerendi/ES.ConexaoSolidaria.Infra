apiVersion: v1
kind: ConfigMap
metadata:
  name: cs-configmap
  labels:
    name: cs-configmap
data: 
  #RabbitMq
  RABBITMQ_HOST: "/"
  RABBITMQ_SVC: cs-rabbitmq-amqp-svc
  RABBITMQ_ENABLED_PLUGINS_FILE: "/etc/rabbitmq/enabled_plugins"
  enabled_plugins: "[rabbitmq_management,rabbitmq_prometheus]."
  RABBITMQ_DONATION_CREATED_QUEUE: "donation-created-queue"
  RABBITMQ_DONATION_PROCESSED_QUEUE: "donation_processed-queue"
  RABBITMQ_USER_CREATED_QUEUE: "user-created-event-not-queue"
  

  #Usuarios
  USUARIOS_DB_SVC: cs-usuarios-db-svc
  USUARIOS_POSTGRES_DB: "cs-usuarios"

  #Campanhas
  CAMPANHAS_DB_SVC: cs-campanhas-db-svc
  CAMPANHAS_POSTGRES_DB: "cs-campanhas"

  #Doacoes
  DOACOES_DB_SVC: cs-doacoes-db-svc
  DOACOES_POSTGRES_DB: "cs-doacoes"

  #Gateway
  GATEWAY_URL: "http://localhost:5006"

  #DynamoDB
  DYNAMODB_SERVICE_URL: "http://cs-dynamo-db-svc:8000"
  DYNAMODB_SVC: cs-dynamo-db
  DYNAMO_TABLE_AUDIT: "cs-audit-log"
  DYNAMO_TABLE_APPLOGS: "cs-app-log"

  #Redis
  REDIS_SERVICE_URL: "cs-redis-svc:6379"
  CACHE_CAMPANHA_ATIVA_TTL_SECONDS: "60"
  CACHE_CAMPANHA_NAO_ATIVA_TTL_SECONDS: "86400"

  #ElasticSearch
  DISCOVERY_TYPE: "single-node"
  XPACK_SECURITY_ENABLED: "false"
  XPACK_SECURITY_HTTP_SSL_ENABLED: "false"
  ES_JAVA_OPTS: "-Xms512m -Xmx512m"
  ELASTICSEARCH_SERVICE_URL: "http://cs-elasticsearch:9200"

  #MailPit
  EMAIL_SMTP_HOST: "cs-mailpit-svc"
  EMAIL_SMTP_PORT: "1025"
  EMAIL_REMETENTE: "Conexao Solidaria"
  EMAIL_EMAIL_REMETENTE: "noreply@conexao-solidaria.com.br"


  #AWS - Chave Falsa, so para rodar o dynamo local
  AWS_ACCESS_KEY_ID: "AKIAIOSFODNN7EXAMPLE"
  AWS_SECRET_ACCESS_KEY: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
  AWS_DEFAULT_REGION: "us-east-1"

  #.NetCore
  ASPNETCORE_ENVIRONMENT: Development
  ASPNETCORE_URLS: http://+:8080

  #Variables
  #Type - LOCAL - local kubernetes | LAB = AWS Lab
  APPLICATION_TYPE: "LOCAL"
  CUSTOMLOGGING_LOGINFO: "True"
  CUSTOMLOGGING_LOGWARNING: "True"
  CUSTOMLOGGING_LOGERROR: "True"
  CUSTOMLOGGING_SENDLOGTODB: "True"