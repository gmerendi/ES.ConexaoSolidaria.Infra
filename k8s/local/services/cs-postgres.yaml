# *********************************************************************************************************************** #
# USUARIOS-DB                                                                                                             #       
# *********************************************************************************************************************** #
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs-usuarios-db
  labels:
    app: cs-usuarios-db
    project: conexao-solidaria
spec:
  replicas: 1
  # Recreate: necessário pois o PVC é ReadWriteOnce — não permite dois pods simultâneos
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cs-usuarios-db
  template:
    metadata:
      labels:
        app: cs-usuarios-db
        project: conexao-solidaria
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - name: postgres
              containerPort: 5432

          # ── Variáveis de ambiente ────────────────────────────────────────
          env:
            # Não-sensíveis: ConfigMap
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: USUARIOS_POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: cs-secrets
                  key: USUARIOS_POSTGRES_USER

            # Sensível: Secret
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cs-secrets
                  key: USUARIOS_POSTGRES_PASSWORD

          # ── Recursos ────────────────────────────────────────────────────
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          # ── Liveness Probe ───────────────────────────────────────────────
          # Se falhar: Kubernetes reinicia o container
          livenessProbe:
            exec:
              command:
                - pg_isready
                - "-U"
                - fiap
                - "-d"
                - cs-usuarios
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
            successThreshold: 1

          # ── Readiness Probe ──────────────────────────────────────────────
          # Se falhar: pod sai do Service até estar pronto, sem reiniciar
          readinessProbe:
            exec:
              command:
                - pg_isready
                - "-U"
                - fiap
                - "-d"
                - cs-usuarios
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 5
            successThreshold: 1

          # ── Volume ───────────────────────────────────────────────────────
          volumeMounts:
            - name: cs-usuarios-db-data
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: cs-usuarios-db-data
          persistentVolumeClaim:
            claimName: cs-usuarios-db-pvc



