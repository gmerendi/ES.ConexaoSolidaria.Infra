apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs-elasticsearch
  namespace: default
  labels:
    app: cs-elasticsearch
    project: conexao-solidaria
spec:
  replicas: 1
  # Recreate: PVC é ReadWriteOnce — não permite dois pods simultâneos
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cs-elasticsearch
  template:
    metadata:
      labels:
        app: cs-elasticsearch
        project: conexao-solidaria
    spec:
      # --- Bloco de Inicialização Corrigido e Expandido ---
      initContainers:
        # 1. Ajusta o Kernel (Já existia no seu arquivo)
        - name: increase-vm-max-map-count
          image: busybox
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
          securityContext:
            privileged: true

        # 2. NOVO: Corrige as permissões da pasta para evitar o AccessDeniedException / node.lock
        - name: fix-volume-permissions
          image: busybox
          command: ["sh", "-c", "chown -R 1000:1000 /usr/share/elasticsearch/data && chmod -R 775 /usr/share/elasticsearch/data"]
          securityContext:
            privileged: true # Usa o privilégio elevado para destravar a pasta montada do Windows/Host
          volumeMounts:
            - name: cs-elasticsearch-data
              mountPath: /usr/share/elasticsearch/data

      securityContext:
        fsGroup: 1000 # Mantido como boa prática para o grupo do Elastic
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
          ports:
            - name: http
              containerPort: 9200
            - name: transport
              containerPort: 9300

          # ── Variáveis de ambiente — ConfigMap ────────────────────────────
          env:
            - name: discovery.type
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: DISCOVERY_TYPE

            - name: xpack.security.enabled
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: XPACK_SECURITY_ENABLED

            - name: xpack.security.http.ssl.enabled
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: XPACK_SECURITY_HTTP_SSL_ENABLED

            - name: ES_JAVA_OPTS
              valueFrom:
                configMapKeyRef:
                  name: cs-configmap
                  key: ES_JAVA_OPTS

          # ── Recursos ─────────────────────────────────────────────────────
          resources:
            requests:
              cpu: "256m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "1.5Gi"

          # ── Liveness Probe ────────────────────────────────────────────────
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: 9200
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1

          # ── Readiness Probe ───────────────────────────────────────────────
          readinessProbe:
            httpGet:
              path: /_cluster/health?wait_for_status=yellow&timeout=5s
              port: 9200
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
            successThreshold: 1

          # ── Volume ────────────────────────────────────────────────────────
          volumeMounts:
            - name: cs-elasticsearch-data
              mountPath: /usr/share/elasticsearch/data

      volumes:
        - name: cs-elasticsearch-data
          persistentVolumeClaim:
            claimName: cs-elasticsearch-pvc